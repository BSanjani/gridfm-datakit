network:
  name: case24_ieee_rts
  source: pglib
  network_dir: none

settings:
  mode: pf
  data_dir: ./data_out_ieee24_droop_droop_10k
  num_processes: 16
  max_iter: 350
  pf_fast: false
  dcpf_fast: true
  seed: 42
  overwrite: true
  large_chunk_size: 2250
  include_dc_res: true
  enable_solver_logs: false

droop_control:
  enabled: true
  f_nominal: 60.0
  omega_0: 1.0
  V_0: 1.0
  ref_bus: '13'
  droop_buses: ['1', '2', '7', '13', '15', '16', '18', '21', '22', '23']
  randomize_droop: true
  mp_range: [0.03, 0.05]
  mq_range: [0.02, 0.04]
  frequency_deadband: 0.0006  # ±0.036 Hz (±0.06% at 60 Hz)
  voltage_deadband: 0.0001     # ±0.01% voltage deadband

load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 10000
  start_scaling_factor: 0.7
  max_scaling_factor: 1.1
  step_size: 0.1
  global_range: 0.2
  sigma: 0.1
  change_reactive_power: true

topology_perturbation:
  type: random
  n_topology_variants: 20
  k: 1
  elements: [branch, gen]

admittance_perturbation:
  type: random_perturbation
  sigma: 0.2

generation_perturbation:
  type: cost_permutation
  sigma: 1.0