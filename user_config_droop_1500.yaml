# IEEE 14-Bus System Configuration - CORRECTED FOR FEASIBILITY
# Use this for basic power flow comparison with PSCAD

network:
  name: case14_ieee_corrected
  source: file
  network_dir: .

settings:
  mode: pf
  data_dir: ./data_out_ieee14_droop_withdeadband
  num_processes: 8
  max_iter: 300
  pf_fast: false
  dcpf_fast: true
  seed: 42
  overwrite: true
  large_chunk_size: 1000
  include_dc_res: true
  enable_solver_logs: true  # Enable to see what's happening

# CRITICAL FIX: Reference bus must be the slack bus (Bus 0)
droop_control:
  enabled: false  # ✅ DISABLED for basic power flow comparison
  f_nominal: 60.0
  omega_0: 1.0
  V_0: 1.0
  ref_bus: '0'  # ✅ CORRECTED: Bus 0 is the slack generator (was '13' which is a LOAD!)
  droop_buses: ['0', '1', '2', '5', '7']  # ✅ CORRECT: All 5 generator buses
  
  # For advanced studies, you can enable these later:
  randomize_droop: true  # Keep false for deterministic results
  mp_range: [0.03, 0.05]
  mq_range: [0.02, 0.04]
  frequency_deadband: 0.006  # 0.6% frequency deadband
  voltage_deadband: 0.001  # 0.1% voltage deadband

# Base load case (no variations for initial comparison)
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 1
  start_scaling_factor: 1.0
  max_scaling_factor: 1.0
  step_size: 0.1
  global_range: 0.0  # ✅ CHANGED: 0.0 = no random load variations
  sigma: 0.0  # ✅ CHANGED: 0.0 = no random variations
  change_reactive_power: false  # ✅ CHANGED: Keep Q loads fixed

# DISABLED perturbations for feasible base case
topology_perturbation:
  type: none  # ✅ DISABLED: No topology changes
  # n_topology_variants: 0  # ✅ No random disconnections
  # k: 0
  # elements: []

admittance_perturbation:
  type: none  # ✅ DISABLED: No admittance perturbations
  # sigma: 0.0

generation_perturbation:
  type: none  # ✅ DISABLED: No generator cost changes
  # sigma: 0.0

# NOTES:
# - This configuration runs a SINGLE base case power flow
# - No random perturbations = deterministic, feasible results
# - Perfect for comparing with PSCAD steady-state results
# - Once this works, you can enable perturbations incrementally